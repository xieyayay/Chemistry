# ==========================================================================
#  离线演示版配置
# --------------------------------------------------------------------------
#  用途：生成一份「双击就能看」的网站副本，方便当面演示、或整个文件夹发给别人
#        （比如发给服务器主人先看看效果）。
#
#  与正式版的唯一区别是 use_directory_urls: false：
#    正式版  链接是  systems/task-system/        ← 只有 HTTP 服务器能映射到 index.html
#    演示版  链接是  systems/task-system.html    ← 双击就能打开
#
#  用法：双击 生成演示版.cmd，或手动运行
#        mkdocs build -f mkdocs.offline.yml --clean
#
#  ⚠ 这个版本是给人看的，不要拿去部署。正式部署用 site/（由 mkdocs.yml 生成）。
# ==========================================================================

INHERIT: mkdocs.yml

use_directory_urls: false

site_dir: site-offline
