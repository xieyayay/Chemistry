site_name: aa · 技术文档
site_description: 基于UE5 5.4.4全蓝图的虚拟仿真化学实验教学软件

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换亮色模式
  extra_css:
    - stylesheets/extra.css
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - 首页: index.md
  - 快速入门:
      - 项目概览: getting-started/project-overview.md
  - 关卡序列动画:
      - Level Sequence: animation/level-sequence.md
  - UI & Widget:
      - Widget 系统概述: ui/widget-overview.md
      - UI 动画: ui/widget-animation.md
  - 蓝图笔记:
      - 通信与命名: blueprints/blueprint-notes.md
      - 可复用蓝图: blueprints/reusable-blueprints.md
  - 系统模块:
      - AI 对话系统: systems/ai-dialog.md
      - 任务系统: systems/task-system.md
      - 关卡流式加载: systems/level-streaming.md
  - 资源规范:
      - 模型资源: assets/models.md
  - 第三方插件:
      - 插件说明: plugins/third-party.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - toc:
      permalink: true
